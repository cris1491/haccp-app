<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>HACCP Cucina</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#eaf0f1; --surface:#f8fbfb; --surface-2:#dfe9eb; --fg:#122229; --muted:#566a72; --line:#c9d7db;
  --accent:#0a6a78; --accent-fg:#ffffff; --accent-soft:#d3ebee;
  --ok:#1b7a43; --ok-bg:#d8f0e1; --bad:#b3261e; --bad-bg:#fbdedb; --warn:#8a5a00; --warn-bg:#fbeccb;
  --display:'Barlow Condensed','Arial Narrow',sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0d1a1f; --surface:#15262c; --surface-2:#1d3239; --fg:#e4eef0; --muted:#8ea5ac; --line:#2a414a;
    --accent:#52c3d1; --accent-fg:#04232a; --accent-soft:#153840;
    --ok:#6fd69a; --ok-bg:#17382a; --bad:#ff9a90; --bad-bg:#3d1f1d; --warn:#f2c36b; --warn-bg:#3a2d0f; color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
body.locked{overflow:hidden}
[hidden]{display:none!important}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.app{max-width:1100px;margin:0 auto;padding-block:16px 40px;padding-left:var(--gl);padding-right:var(--gr)}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-bottom:10px}
.top h1{font-family:var(--display);font-weight:700;font-size:2rem;line-height:1;margin:0;text-transform:uppercase;letter-spacing:.02em}
.top p{margin:4px 0 0;color:var(--muted);font-size:.88rem}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 0 10px;margin:0 0 14px;border-bottom:2px solid var(--fg);position:sticky;top:0;background:var(--bg);z-index:5;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;min-height:48px;padding:0 16px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);font-family:var(--display);font-weight:700;font-size:1.15rem;text-transform:uppercase;letter-spacing:.05em}
.tab[aria-current=page]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}

.head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.head h2{font-family:var(--display);font-weight:700;font-size:1.6rem;text-transform:uppercase;letter-spacing:.04em;margin:0}
.head h2 small{font-size:1rem;color:var(--muted);margin-left:8px;text-transform:none;letter-spacing:0;font-family:var(--body)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{min-height:48px;padding:0 18px;border-radius:8px;border:1.5px solid var(--fg);background:transparent;font-family:var(--display);font-weight:700;font-size:1.1rem;text-transform:uppercase;letter-spacing:.05em}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.danger.solid{background:var(--bad);color:var(--surface)}
.btn.small{min-height:40px;padding:0 12px;font-size:1rem}
.btn:disabled{opacity:.5;cursor:default}
.link{min-height:40px;border:0;background:transparent;color:var(--accent);text-decoration:underline;padding:0}

.notice{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 14px;border-radius:8px;margin-bottom:12px;background:var(--accent-soft);border:1px solid var(--line);font-size:.95rem}
.notice.warn{background:var(--bad-bg);color:var(--bad);border-color:transparent}

.day{font-family:var(--display);font-weight:600;font-size:.95rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:18px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.card{display:flex;gap:12px;align-items:stretch;text-align:left;width:100%;min-width:0;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg)}
button.card:hover{border-color:var(--accent)}
.thumb{position:relative;flex:0 0 72px;height:72px;border-radius:6px;overflow:hidden;background:var(--surface-2)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb-n{position:absolute;right:3px;bottom:3px;background:rgba(10,20,24,.75);color:#fff;font:500 .72rem var(--mono);padding:1px 5px;border-radius:4px}
.cbody{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.ctitle{font-weight:600;font-size:1.05rem;overflow-wrap:anywhere}
.cmeta{color:var(--muted);font-size:.85rem;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.chip{font-size:.8rem;padding:2px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.pill{font-weight:600;font-size:.8rem;padding:2px 10px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.nc{background:var(--bad-bg);color:var(--bad)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.empty{padding:24px 4px;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:1.1rem;margin-bottom:4px}

.big{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.bigbtn{display:flex;flex-direction:column;gap:6px;text-align:left;padding:18px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);min-height:120px}
.bigbtn:hover{border-color:var(--accent)}
.bigbtn b{font-family:var(--display);font-size:1.5rem;text-transform:uppercase;letter-spacing:.04em}
.bigbtn span{color:var(--muted)}
.section{margin:0 0 22px;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.section h3{font-family:var(--display);font-size:1.3rem;text-transform:uppercase;letter-spacing:.04em;margin:0 0 6px}
.section p{margin:0 0 12px;color:var(--muted)}

.overlay{position:fixed;inset:0;background:rgba(6,14,18,.6);display:flex;align-items:stretch;justify-content:center}
.panel{display:flex;flex-direction:column;width:100%;height:100%;background:var(--surface);min-height:0}
.p-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px var(--gr) 12px var(--gl);border-bottom:1px solid var(--line)}
.p-head h2{font-family:var(--display);font-weight:700;font-size:1.5rem;text-transform:uppercase;letter-spacing:.03em;margin:0;overflow-wrap:anywhere}
.p-body{flex:1;min-height:0;overflow-y:auto;padding:16px var(--gr) 16px var(--gl);-webkit-overflow-scrolling:touch}
.p-foot{display:flex;gap:10px;flex-wrap:wrap;padding:12px var(--gr) 12px var(--gl);border-top:1px solid var(--line);background:var(--surface)}
.p-foot .btn{flex:1 1 140px;min-height:54px}
@media (min-width:760px){
  .overlay{align-items:center;padding:24px}
  .panel{height:auto;max-height:100%;max-width:720px;border-radius:16px;overflow:hidden}
}

.field{display:flex;flex-direction:column;gap:6px;margin:0 0 14px;padding:0;border:0;min-width:0}
.lbl{font-family:var(--display);font-weight:600;font-size:.95rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:0;display:flex;gap:8px;align-items:center}
.vtag{display:none;background:var(--warn-bg);color:var(--warn);border-radius:4px;padding:0 6px;font-family:var(--body);font-size:.75rem;letter-spacing:0;text-transform:none;font-weight:600}
.verify+.vtag,.field.isverify .vtag{display:inline-block}
input[type=text],input[type=date],input[type=number],input:not([type]),textarea,select{width:100%;min-height:52px;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);font-size:1rem}
textarea{resize:vertical;min-height:84px}
input.verify,select.verify{border-color:var(--warn);background:var(--warn-bg)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tempwrap{display:flex;gap:8px}
.tempwrap input{min-width:0}
.sign{flex:0 0 52px;min-height:52px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface-2);font-size:1.2rem;font-weight:600}
.shoot{display:flex;align-items:center;justify-content:center;gap:12px;min-height:64px;width:100%;border:2px dashed var(--accent);border-radius:10px;background:var(--accent-soft);color:var(--accent);font-family:var(--display);font-weight:700;font-size:1.3rem;text-transform:uppercase;letter-spacing:.05em;text-align:center;padding:8px 12px}
.shoot[aria-busy=true]{opacity:.6;pointer-events:none}
.thumbs{display:flex;flex-wrap:wrap;gap:10px}
.thumbs:empty{display:none}
.dthumb{position:relative;width:88px;height:88px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2)}
.dthumb img{width:100%;height:100%;object-fit:cover;display:block}
.dthumb button{position:absolute;top:2px;right:2px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(10,20,24,.75);color:#fff;font-size:1.1rem;line-height:1}
.status{margin:0 0 12px;padding:8px 12px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-size:.92rem}
.status:empty{display:none}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--line);border-radius:8px;overflow:hidden}
.seg label{display:block;position:relative}
.seg span{display:flex;align-items:center;justify-content:center;min-height:52px;padding:0 8px;font-weight:600;background:var(--bg);text-align:center}
.seg label+label span{border-left:1.5px solid var(--line)}
.seg input:checked+span{background:var(--ok-bg);color:var(--ok)}
.seg label:last-child input:checked+span{background:var(--bad-bg);color:var(--bad)}
.seg input:focus-visible+span{outline:3px solid var(--accent);outline-offset:-3px}
.err{margin:0 0 12px;padding:10px 12px;border-radius:8px;background:var(--bad-bg);color:var(--bad);font-weight:500}
.hint{margin:6px 0 0;color:var(--muted);font-size:.88rem}

.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0 0 16px}
.kv dt{font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-size:.9rem}
.kv dd{margin:0;overflow-wrap:anywhere}
.photos{display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
.photos img{width:100%;border-radius:8px;border:1px solid var(--line);display:block}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);min-height:60px}
.item.sel{border-color:var(--accent);background:var(--accent-soft)}
.item .cbody{flex:1}
.comp{padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);margin-bottom:10px}
.comp h4{margin:0 0 6px;font-size:1.05rem}
.comp .st{font-size:.9rem;color:var(--muted);margin:2px 0}
.comp .st.miss{color:var(--warn)}
.comp .btns{margin-top:8px}
.tree{display:flex;flex-direction:column;gap:2px}
.tl{padding:6px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.tl.prod{font-weight:600;margin-top:6px}
.tl small{display:block;color:var(--muted);font-weight:400}
.toast{position:fixed;z-index:1000;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:min(92vw,520px);background:var(--fg);color:var(--bg);padding:12px 16px;border-radius:10px;font-weight:500;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.comp .st.bad,.st.bad{color:var(--bad);font-weight:600}
.lab{border:2px solid #111;border-radius:8px;padding:14px 16px;background:#fff;color:#111;max-width:340px}
.lab b{display:block;font-family:var(--display);font-size:2.1rem;line-height:1.05;margin-bottom:8px;overflow-wrap:anywhere}
.lab div{font-size:1.15rem;font-family:var(--mono)}
@media print{body *{visibility:hidden}#labelPrint,#labelPrint *{visibility:visible}#labelPrint{position:absolute;left:0;top:0;max-width:none;width:90mm}}
@media (max-width:759px){.top h1{font-size:1.7rem}.row2{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <h1>HACCP Cucina</h1>
      <p>I dati restano salvati su questo dispositivo.</p>
    </div>
  </header>
  <nav class="tabs" id="tabs" aria-label="Sezioni"></nav>
  <div id="notices"></div>
  <main id="view"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s);};
function h(tag,attrs){
  var el=document.createElement(tag);
  if(attrs){for(var k in attrs){var v=attrs[k];if(v==null||v===false)continue;
    if(k==='class')el.className=v;else if(k==='text')el.textContent=v;
    else if(k==='value')el.value=v;
    else if(k.indexOf('on')===0)el.addEventListener(k.slice(2),v);
    else el.setAttribute(k,v===true?'':v);}}
  for(var i=2;i<arguments.length;i++){var c=arguments[i];if(c==null||c===false)continue;
    if(Array.isArray(c)){c.forEach(function(x){if(x!=null&&x!==false)el.append(x.nodeType?x:document.createTextNode(x));});}
    else el.append(c.nodeType?c:document.createTextNode(c));}
  return el;
}
function lsGet(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function p2(n){return String(n).padStart(2,'0');}
function uid(){return (window.crypto&&crypto.randomUUID)?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2,9);}
function pill(t,k){return h('span',{class:'pill '+k,text:t});}

/* ---------- date ---------- */
function todayISO(){var d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function addDays(iso,n){var p=iso.split('-'),d=new Date(+p[0],+p[1]-1,+p[2]+n);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function fmtISO(iso){if(!iso)return '';var p=iso.split('-');return p[2]+'/'+p[1]+'/'+p[0];}
function daysTo(iso){var p=iso.split('-'),d=new Date(+p[0],+p[1]-1,+p[2]),t=new Date();t.setHours(0,0,0,0);return Math.round((d-t)/864e5);}
function fmtTime(ts){var d=new Date(ts);return p2(d.getHours())+':'+p2(d.getMinutes());}
function fmtDate(ts){var d=new Date(ts);return p2(d.getDate())+'/'+p2(d.getMonth()+1)+'/'+d.getFullYear();}
function fmtDT(ts){return fmtDate(ts)+' '+fmtTime(ts);}
function fmtTemp(t){var s=(Math.round(t*10)/10).toFixed(1).replace('.',',');return (t>0?'+':'')+s+' °C';}
function dayKey(ts){var d=new Date(ts);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function dayLabel(ts){
  var base=new Date(ts).toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'});
  var k=dayKey(ts);
  if(k===dayKey(Date.now()))return 'Oggi · '+base;
  if(k===dayKey(Date.now()-864e5))return 'Ieri · '+base;
  return base;
}
function monthKey(ts){var d=new Date(ts);return d.getFullYear()+'-'+p2(d.getMonth()+1);}
function monthLabel(k){var p=k.split('-'),s=new Date(+p[0],+p[1]-1,1).toLocaleDateString('it-IT',{month:'long',year:'numeric'});return s.charAt(0).toUpperCase()+s.slice(1);}
function expPill(iso){
  if(!iso)return null;var n=daysTo(iso);
  if(n<0)return pill('Scaduto il '+fmtISO(iso),'nc');
  if(n<=2)return pill(n===0?'Scade oggi':'Scade tra '+n+(n===1?' giorno':' giorni'),'warn');
  return pill('Scade '+fmtISO(iso),'ok');
}
function parseTemp(v){
  v=String(v||'').trim().replace('−','-').replace(',','.');
  if(v==='')return {ok:true,val:null};
  if(!/^[+-]?\d+(\.\d+)?$/.test(v))return {ok:false};
  var n=Number(v);if(n<-60||n>90)return {ok:false};
  return {ok:true,val:n};
}

/* ---------- testo ---------- */
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim();}
function dice(a,b){
  a=norm(a);b=norm(b);if(!a||!b)return 0;if(a===b)return 1;if(a.length<2||b.length<2)return 0;
  var m={},i,n=0,g;
  for(i=0;i<a.length-1;i++){g=a.substr(i,2);m[g]=(m[g]||0)+1;}
  for(i=0;i<b.length-1;i++){g=b.substr(i,2);if(m[g]>0){m[g]--;n++;}}
  return 2*n/(a.length+b.length-2);
}
function titleCase(s){return s.toLowerCase().replace(/(^|\s)([a-zà-ú])/g,function(m,a,b){return a+b.toUpperCase();});}
function byName(a,b){return a.name.localeCompare(b.name,'it');}

/* ---------- archivio locale ---------- */
var STORES=['bolle','fornitori','ingredienti','lotti','ricette','produzioni','apparecchi','temperature'];
var S={db:null,bolle:[],fornitori:[],ingredienti:[],lotti:[],ricette:[],produzioni:[],apparecchi:[],temperature:[],m:{},tab:'ric',urls:[],lastExport:lsGet('haccp.lastExport')};
function reindex(){
  S.m={ing:{},lot:{},ric:{},prod:{},bolla:{},app:{}};
  S.apparecchi.forEach(function(x){S.m.app[x.id]=x;});
  S.ingredienti.forEach(function(x){S.m.ing[x.id]=x;});
  S.lotti.forEach(function(x){S.m.lot[x.id]=x;});
  S.ricette.forEach(function(x){S.m.ric[x.id]=x;});
  S.produzioni.forEach(function(x){S.m.prod[x.id]=x;});
  S.bolle.forEach(function(x){S.m.bolla[x.id]=x;});
}
function idbOpen(){
  return new Promise(function(res,rej){
    var rq;try{rq=indexedDB.open('haccp-ricezione',3);}catch(e){rej(e);return;}
    rq.onupgradeneeded=function(){
      var d=rq.result;
      STORES.forEach(function(n){if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:'id'});});
    };
    rq.onsuccess=function(){res(rq.result);};
    rq.onerror=function(){rej(rq.error);};
    rq.onblocked=function(){rej(new Error('blocked'));};
  });
}
function tx(store,mode,fn){
  return new Promise(function(res,rej){
    var t=S.db.transaction(store,mode),rq=fn(t.objectStore(store));
    t.oncomplete=function(){res(rq?rq.result:undefined);};
    t.onerror=function(){rej(t.error);};
    t.onabort=function(){rej(t.error||new Error('abort'));};
  });
}
function save(store,rec){
  var arr=S[store],i=arr.findIndex(function(x){return x.id===rec.id;});
  if(i>=0)arr[i]=rec;else arr.push(rec);
  reindex();
  return S.db?tx(store,'readwrite',function(s){return s.put(rec);}):Promise.resolve();
}
function remove(store,id){
  S[store]=S[store].filter(function(x){return x.id!==id;});
  reindex();
  return S.db?tx(store,'readwrite',function(s){return s.delete(id);}):Promise.resolve();
}
function clearStore(store){
  S[store]=[];reindex();
  return S.db?tx(store,'readwrite',function(s){return s.clear();}):Promise.resolve();
}

/* ---------- avvisi e finestre ---------- */
var toastTimer;
function toast(msg){var t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.hidden=true;},4200);}
var zTop=100,sheets=[];
function sheet(title,o){
  o=o||{};
  var sh={onClose:[],urls:[]};
  var body=h('div',{class:'p-body'}),foot=h('div',{class:'p-foot'});
  var closeBtn=h('button',{type:'button',class:'link',text:o.closeLabel||'Chiudi'});

var tessP=null,worker=null,curProg=null;
function loadTess(){
  if(window.Tesseract)return Promise.resolve(window.Tesseract);
  if(!tessP)tessP=new Promise(function(res,rej){
    var s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.0/tesseract.min.js';
    s.onload=function(){res(window.Tesseract);};
    s.onerror=function(){tessP=null;rej(new Error('offline'));};
    document.head.append(s);
  });
  return tessP;
}
function prepOcr(blob){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(blob),img=new Image();
    img.onload=function(){
      var w=img.naturalWidth,hh=img.naturalHeight,sc=2000/Math.max(w,hh);
      if(sc>1.5)sc=1.5;
      var cw=Math.round(w*sc),ch=Math.round(hh*sc),c=document.createElement('canvas');
      c.width=cw;c.height=ch;
      var cx=c.getContext('2d');cx.drawImage(img,0,0,cw,ch);URL.revokeObjectURL(url);
      try{
        var d=cx.getImageData(0,0,cw,ch),px=d.data,hist=new Array(256).fill(0),i,g;
        for(i=0;i<px.length;i+=4){g=(px[i]*0.299+px[i+1]*0.587+px[i+2]*0.114)|0;px[i]=px[i+1]=px[i+2]=g;hist[g]++;}
        var tot=cw*ch,lo=0,hi=255,acc=0;
        for(i=0;i<256;i++){acc+=hist[i];if(acc>tot*0.02){lo=i;break;}}
        acc=0;for(i=255;i>=0;i--){acc+=hist[i];if(acc>tot*0.02){hi=i;break;}}
        if(hi-lo>30){var k=255/(hi-lo);for(i=0;i<px.length;i+=4){g=(px[i]-lo)*k;g=g<0?0:g>255?255:g;px[i]=px[i+1]=px[i+2]=g;}}
        cx.putImageData(d,0,0);
      }catch(e){}
      res(c);
    };

    img.src=url;
  });
}
async function ocrBlob(blob,onProg){
  var T=await loadTess();

  curProg=onProg||null;

/* ---------- interpretazione del testo letto ---------- */
function mkISO(y,m,d){
  if(y<100)y+=2000;
  if(m<1||m>12||d<1||d>31||y<2000||y>2100)return null;
  var dt=new Date(y,m-1,d);if(dt.getMonth()!==m-1)return null;
  return y+'-'+p2(m)+'-'+p2(d);
}
var MESI={gen:1,feb:2,mar:3,apr:4,mag:5,giu:6,lug:7,ago:8,set:9,ott:10,nov:11,dic:12};
function findDates(text){
  var out=[],m,iso;
  var r1=/(\d{1,2})\s*[\/\.\-]\s*(\d{1,2})\s*[\/\.\-]\s*(\d{4}|\d{2})(?!\d)/g;
  while((m=r1.exec(text))){iso=mkISO(+m[3],+m[2],+m[1]);if(iso)out.push({iso:iso,idx:m.index});}
  var r2=/(\d{4})\s*[\-\/]\s*(\d{1,2})\s*[\-\/]\s*(\d{1,2})(?!\d)/g;
  while((m=r2.exec(text))){iso=mkISO(+m[1],+m[2],+m[3]);if(iso)out.push({iso:iso,idx:m.index});}
  var r3=/(\d{1,2})\s+(gen|feb|mar|apr|mag|giu|lug|ago|set|ott|nov|dic)[a-z]*\.?\s+(\d{4}|\d{2})(?!\d)/gi;
  while((m=r3.exec(text))){iso=mkISO(+m[3],MESI[m[2].toLowerCase()],+m[1]);if(iso)out.push({iso:iso,idx:m.index});}
  return out.sort(function(a,b){return a.idx-b.idx;});
}
function findExpiry(text){
  var ds=findDates(text);if(!ds.length)return '';
  var kw=/scad|entro|consum|tmc|best|exp|use by|da consumarsi/i;
  for(var i=0;i<ds.length;i++){
    var before=text.slice(Math.max(0,ds[i].idx-40),ds[i].idx);
    if(kw.test(before))return ds[i].iso;
  }
  return ds.map(function(d){return d.iso;}).sort().pop();
}
function findLot(text){
  var res=[/(?:\blotto|\blot)\b\s*(?:n[°o\.]?\s*)?[:.\-]?\s*([A-Z0-9][A-Z0-9\-\/\.]{2,19})/gi,/(?:^|[\s(])L\s*[:.]\s*([A-Z0-9][A-Z0-9\-\/]{2,19})/gm,/(?:^|\s)L\s+(\d[A-Z0-9\-\/]{3,19})/gm],i,m;
  for(i=0;i<res.length;i++){
    res[i].lastIndex=0;
    while((m=res[i].exec(text))){
      var c=m[1].replace(/[.\-\/]+$/,'');
      if(/\d/.test(c)&&!/^\d{1,2}[\/\.\-]\d{1,2}[\/\.\-]\d{2,4}$/.test(c))return c.toUpperCase();
    }
  }
  return '';
}
function guessProduct(text){
  var lines=text.split(/\n/).map(function(l){return l.trim();}).filter(Boolean);
  var nt=norm(text),best=null,bs=0;
  S.ingredienti.forEach(function(ing){
    var n=norm(ing.name);if(n.length<3)return;
    var sc=nt.indexOf(n)>=0?1:0;
    if(!sc)lines.forEach(function(l){var d=dice(l,ing.name);if(d>sc)sc=d;});
    if(sc>bs){bs=sc;best=ing;}
  });
  if(best&&bs>=0.6)return {name:best.name,ing:best};
  var bad=/lott|scad|peso|netto|kg\b|€|conserv|ingredient|prodott[oi] in|stabilimento|tmc|data|www|tel|\d{3,}/i,cand=null,cl=0;
  lines.slice(0,8).forEach(function(l){
    var letters=(l.match(/[A-Za-zÀ-ÿ]/g)||[]).length;
    if(letters<4||letters/l.length<0.6||bad.test(l)||l.length>40)return;
    if(letters>cl){cl=letters;cand=l;}
  });
  return cand?{name:titleCase(cand.replace(/[^A-Za-zÀ-ÿ0-9' \-]/g,'').trim()),ing:null}:null;
}
function guessSupplier(text){
  var nt=norm(text),best=null,bl=0;
  S.fornitori.forEach(function(f){var n=norm(f.name);if(n.length>=3&&nt.indexOf(n)>=0&&n.length>bl){best=f.name;bl=n.length;}});
  if(best)return best;
  var lines=text.split(/\n/).map(function(l){return l.trim();}).filter(Boolean),bs=0;
  S.fornitori.forEach(function(f){lines.slice(0,15).forEach(function(l){var d=dice(l,f.name);if(d>bs&&d>=0.62){bs=d;best=f.name;}});});
  if(best)return best;
  var skip=/documento|ddt|trasporto|data\b|pagina|cliente|destinat|^\W*$/i;
  for(var i=0;i<Math.min(lines.length,6);i++){
    var l=lines[i],letters=(l.match(/[A-Za-zÀ-ÿ]/g)||[]).length;
    if(letters>=4&&letters/l.length>=0.6&&!skip.test(l))return l.replace(/[^A-Za-zÀ-ÿ0-9'&\.\- ]/g,'').trim();
  }
  return '';
}
function findDdtNum(text){
  var re=/\b(?:d\.?\s?d\.?\s?t\.?|documento\s+di\s+trasporto|bolla|numero|nr\.?|n[°o\.])\s*[:.\-]?\s*(?:del\b[^A-Za-z0-9]*)?([A-Z0-9]{0,4}[\/\-]?\d[A-Z0-9\/\-]{0,14})/gi,m;
  while((m=re.exec(text))){
    var c=m[1].replace(/[\/\-]+$/,'');
    if(/^\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4}$/.test(c))continue;
    return c;
  }

function findDdtDate(text){
  var ds=findDates(text),lo=addDays(todayISO(),-45),hi=addDays(todayISO(),1),ok=ds.filter(function(d){return d.iso>=lo&&d.iso<=hi;});
  if(!ok.length)return '';
  for(var i=0;i<ok.length;i++){var b=text.slice(Math.max(0,ok[i].idx-14),ok[i].idx);if(/\bdel\b|data/i.test(b))return ok[i].iso;}

/* ---------- file: salvataggio e invio ---------- */
async function saveFile(filename,data,type){
  var blob=(data instanceof Blob)?data:new Blob([data],{type:type+';charset=utf-8'});
  var file=new File([blob],filename,{type:type});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:filename});return;}
    catch(e){if(e&&e.name==='AbortError'){var er=new Error('declined');er.code='declined';throw er;}}
  }
  var u=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=u;a.download=filename;document.body.append(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(u);},30000);
}
function pdfSafe(s){return String(s==null?'':s).replace(/[·•]/g,'-').replace(/[–—]/g,'-').replace(/[’‘]/g,"'").replace(/[“”]/g,'"').replace(/ /g,' ').replace(/[^\u0000-ÿ]/g,'?');}
function hasPdf(){return !!(window.jspdf&&window.jspdf.jsPDF);}
async function linesPdf(title,subtitle,lines){
  var doc=new window.jspdf.jsPDF({unit:'mm',format:'a4'}),W=210,H=297,M=15,y=24;
  doc.setFont('helvetica','bold');doc.setFontSize(18);doc.text(pdfSafe(title),M,y);y+=7;
  doc.setFont('helvetica','normal');doc.setFontSize(10);doc.setTextColor(90);doc.text(pdfSafe(subtitle),M,y);y+=8;doc.setTextColor(0);
  lines.forEach(function(l){
    var x=M+l.indent*6,w=W-M-x;
    doc.setFont('helvetica',l.bold?'bold':'normal');doc.setFontSize(l.bold?11:10);
    if(l.bold)y+=1.5;
    doc.splitTextToSize(pdfSafe(l.text),w).forEach(function(p){if(y>H-16){doc.addPage();y=20;}doc.text(p,x,y);y+=5.2;});
  });
  var n=doc.getNumberOfPages();
  for(var p=1;p<=n;p++){doc.setPage(p);doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(120);doc.text('Pagina '+p+' di '+n,W-M,H-8,{align:'right'});}
  return doc.output('blob');
}
async function sendFile(filename,data,type,okMsg){
  try{await saveFile(filename,data,type);toast(okMsg||'File pronto. Allegalo a una mail.');return true;}
  catch(e){toast(e&&e.code==='declined'?'Invio annullato.':'Non sono riuscito a preparare il file. Riprova.');return false;}
}

function rowsFor(key){return S.bolle.filter(function(r){return key==='all'||monthKey(r.ts)===key;}).sort(function(a,b){return a.ts-b.ts;});}
function csvCell(v){v=String(v==null?'':v);return /[;"\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function toCsv(rows){return '﻿'+rows.map(function(l){return l.map(csvCell).join(';');}).join('\r\n');}
function bolleCsv(rows){
  var out=[['Data','Ora','Fornitore','N. DDT','Data DDT','Lotto/scadenza','Temperatura (°C)','Esito','Note','Foto']];
  rows.forEach(function(r){out.push([fmtDate(r.ts),fmtTime(r.ts),r.supplier,r.ddt,r.ddtDate?fmtISO(r.ddtDate):'',r.lot,r.temp!=null?String(r.temp).replace('.',','):'',r.esito==='nc'?'Non conforme':'Conforme',r.note,r.photos.length]);});
  return toCsv(out);
}
function blobToDataURL(b){return new Promise(function(res,rej){var fr=new FileReader();fr.onload=function(){res(fr.result);};fr.onerror=function(){rej(fr.error);};fr.readAsDataURL(b);});}
function imgSize(b){return new Promise(function(res,rej){var u=URL.createObjectURL(b),i=new Image();i.onload=function(){res({w:i.naturalWidth,h:i.naturalHeight});URL.revokeObjectURL(u);};i.onerror=function(){URL.revokeObjectURL(u);rej(new Error('img'));};i.src=u;});}
function tick(){return new Promise(function(ok){setTimeout(ok,0);});}
async function bollePdf(rows,label,progress){
  var doc=new window.jspdf.jsPDF({unit:'mm',format:'a4'}),W=210,H=297,M=15,y=50;
  doc.setFont('helvetica','bold');doc.setFontSize(20);doc.text('Registro ricezione merce',M,24);
  doc.setFont('helvetica','normal');doc.setFontSize(11);doc.text(pdfSafe(label),M,32);
  doc.text(rows.length+' ricezioni - generato il '+fmtDT(Date.now()),M,38);
  function head(){
    doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(90);
    doc.text('DATA E ORA',M,y);doc.text('FORNITORE',M+32,y);doc.text('DDT',M+102,y);doc.text('TEMP.',M+138,y);doc.text('ESITO',M+158,y);
    doc.setDrawColor(150);doc.line(M,y+2,W-M,y+2);y+=8;doc.setTextColor(0);doc.setFont('helvetica','normal');doc.setFontSize(10);
  }
  head();
  rows.forEach(function(r){
    if(y>H-20){doc.addPage();y=20;head();}
    doc.text(fmtDT(r.ts),M,y);doc.text(doc.splitTextToSize(pdfSafe(r.supplier),66)[0],M+32,y);
    doc.text(doc.splitTextToSize(pdfSafe(r.ddt||'-'),34)[0],M+102,y);doc.text(r.temp!=null?fmtTemp(r.temp):'-',M+138,y);
    if(r.esito==='nc'){doc.setTextColor(179,38,30);doc.setFont('helvetica','bold');doc.text('NON CONF.',M+158,y);doc.setTextColor(0);doc.setFont('helvetica','normal');}
    else doc.text('Conforme',M+158,y);
    y+=7;
  });
  for(var i=0;i<rows.length;i++){
    var r=rows[i];progress(i+1,rows.length);
    for(var k=0;k<r.photos.length;k++){
      doc.addPage();var yy=20;
      doc.setFont('helvetica','bold');doc.setFontSize(14);doc.setTextColor(0);doc.text(doc.splitTextToSize(pdfSafe(r.supplier),W-2*M)[0],M,yy);yy+=7;
      doc.setFont('helvetica','normal');doc.setFontSize(10);
      var parts=[fmtDT(r.ts)];if(r.ddt)parts.push('DDT '+r.ddt);if(r.ddtDate)parts.push('del '+fmtISO(r.ddtDate));if(r.lot)parts.push('Lotto '+r.lot);
      if(r.temp!=null)parts.push('Temp. '+fmtTemp(r.temp));parts.push(r.esito==='nc'?'NON CONFORME':'Conforme');
      var ll=doc.splitTextToSize(pdfSafe(parts.join('  -  ')),W-2*M);doc.text(ll,M,yy);yy+=ll.length*5;
      if(r.note){var nl=doc.splitTextToSize(pdfSafe('Note: '+r.note),W-2*M).slice(0,6);doc.text(nl,M,yy);yy+=nl.length*5;}
      if(r.photos.length>1){doc.setTextColor(110);doc.text('Foto '+(k+1)+' di '+r.photos.length,M,yy);doc.setTextColor(0);yy+=5;}
      yy+=3;
      var b=r.photos[k],sz=await imgSize(b),data=await blobToDataURL(b),maxW=W-2*M,maxH=H-yy-M-6,sc=Math.min(maxW/sz.w,maxH/sz.h),dw=sz.w*sc,dh=sz.h*sc;
      doc.addImage(data,'JPEG',M+(maxW-dw)/2,yy,dw,dh,undefined,'FAST');
    }
    if(i%3===2)await tick();
  }
  var n=doc.getNumberOfPages();
  for(var p=1;p<=n;p++){doc.setPage(p);doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(120);doc.text('Pagina '+p+' di '+n,W-M,H-8,{align:'right'});}
  return doc.output('blob');
}

function ricContains(rid,target,seen){
  seen=seen||{};if(seen[rid])return false;seen[rid]=1;

  return (r.components||[]).some(function(c){return c.kind==='ric'&&(c.refId===target||ricContains(c.refId,target,seen));});
}
function compName(c){var x=c.kind==='ing'?S.m.ing[c.refId]:S.m.ric[c.refId];return x?x.name:'(non più presente)';}
var TIPI=['Condimento','Salsa','Preparazione','Piatto finito'];

function defaultLot(ingId){var ls=lotsOf(ingId);return ls.length?ls[0].id:'';}
function defaultBolle(ingId){
  var ps=S.produzioni.slice().sort(function(a,b){return b.ts-a.ts;});
  for(var i=0;i<ps.length;i++){
    var its=ps[i].items||[];
    for(var j=0;j<its.length;j++)if(its[j].type==='ing'&&its[j].ingId===ingId&&(its[j].bollaIds||[]).length){
      return its[j].bollaIds.filter(function(b){return S.m.bolla[b];});
    }
  }
  return [];
}
function lastProdOf(ricId){
  var ps=S.produzioni.filter(function(p){return p.ricettaId===ricId;}).sort(function(a,b){return b.ts-a.ts;});
  return ps.length?ps[0].id:'';
}
function recipePrefix(name){return (name.normalize('NFD').replace(/[^A-Za-z]/g,'').toUpperCase().slice(0,3)||'PRD');}
function nextLotCode(r){
  var d=new Date(),ds=String(d.getFullYear()).slice(2)+p2(d.getMonth()+1)+p2(d.getDate()),pre=recipePrefix(r.name)+'-'+ds+'-',n=1;
  function taken(c){return S.produzioni.some(function(p){return p.lotInterno===c;});}
  while(taken(pre+p2(n)))n++;
  return pre+p2(n);
}

function prodsUsing(pred){return S.produzioni.filter(function(p){return (p.items||[]).some(pred);}).sort(function(a,b){return a.ts-b.ts;});}
function fwdNode(p,seen){
  seen[p.id]=1;
  var kids=prodsUsing(function(i){return i.type==='prep'&&i.produzioneId===p.id;}).filter(function(k){return !seen[k.id];});
  return {prod:p,kids:kids.map(function(k){return fwdNode(k,seen);})};
}
function showTrace(title,sub,lines,fname){
  var sh=sheet(title),tree=h('div',{class:'tree'});
  sh.body.append(h('p',{class:'hint',text:sub}),tree);
  lines.forEach(function(l){
    var d=h('div',{class:'tl'+(l.bold?' prod':''),text:l.text});d.style.paddingLeft=(l.indent*16)+'px';tree.append(d);
  });
  var info=h('p',{class:'hint'});
  var pdfBtn=h('button',{type:'button',class:'btn primary',text:'Esporta PDF',onclick:async function(){
    if(!hasPdf()){toast('Il PDF non si può preparare adesso (serve internet).');return;}
    pdfBtn.disabled=true;
    try{var b=await linesPdf(title,sub+' - generato il '+fmtDT(Date.now()),lines);await sendFile(fname+'.pdf',b,'application/pdf');}
    catch(e){toast('Non sono riuscito a preparare il PDF.');}
    pdfBtn.disabled=false;
  }});
  sh.foot.append(h('button',{type:'button',class:'btn',text:'Chiudi',onclick:sh.close}),pdfBtn);
}
function traceForward(start){
  var lines=[],sub='',roots=[],title='Dove è finito',fname='tracciabilita-in-avanti';
  if(start.kind==='lotto'){
    var l=S.m.lot[start.id],ing=l&&S.m.ing[l.ingId];if(!l)return;
    sub=(ing?ing.name:'Lotto')+' - '+lotDesc(l);
    roots=prodsUsing(function(i){return i.lottoId===start.id;});
  }else if(start.kind==='bolla'){
    var b=S.m.bolla[start.id];if(!b)return;
    sub='Bolla: '+bollaLabel(b);
    roots=prodsUsing(function(i){return (i.bollaIds||[]).indexOf(start.id)>=0;});
  }else{
    var p=S.m.prod[start.id];if(!p)return;
    sub='Lavorazione: '+prodLine(p);
    roots=prodsUsing(function(i){return i.type==='prep'&&i.produzioneId===start.id;});
  }
  var seen={};
  function walk(n,lv){lines.push({indent:lv,bold:true,text:fmtDT(n.prod.ts)+' - '+prodLine(n.prod)});n.kids.forEach(function(k){walk(k,lv+1);});}
  roots.forEach(function(r){if(!seen[r.id])walk(fwdNode(r,seen),0);});
  var tot=Object.keys(seen).length;
  if(!tot)lines.push({indent:0,text:'Nessuna lavorazione registrata con questo elemento.'});
  else lines.unshift({indent:0,text:'Usato in '+tot+(tot===1?' lavorazione (compresi i piatti che le usano):':' lavorazioni (compresi i piatti che le usano):')});
  showTrace(title,sub,lines,fname);
}
function backLines(p,lv,lines,seen){
  if(seen[p.id])return;seen[p.id]=1;
  lines.push({indent:lv,bold:true,text:fmtDT(p.ts)+' - '+prodLine(p)});
  (p.items||[]).forEach(function(it){
    if(it.type==='ing'){
      var l=S.m.lot[it.lottoId];
      lines.push({indent:lv+1,text:it.name+': '+(l?lotDesc(l):'nessuna etichetta collegata')});
      (it.bollaIds||[]).forEach(function(b){var bb=S.m.bolla[b];lines.push({indent:lv+2,text:'Bolla: '+(bb?bollaLabel(bb)+(bb.temp!=null?' · '+fmtTemp(bb.temp):''):'(eliminata)')});});
    }else{
      var pp=S.m.prod[it.produzioneId];
      if(pp){lines.push({indent:lv+1,text:it.name+':'});backLines(pp,lv+2,lines,seen);}
      else lines.push({indent:lv+1,text:it.name+': nessuna lavorazione collegata'});
    }
  });
}
function traceBackward(id){
  var p=S.m.prod[id];if(!p)return;

    if(!n){showErr(err,'Scrivi il nome del fornitore.');return;}
    if(S.fornitori.some(function(f){return norm(f.name)===norm(n);})){showErr(err,'Questo fornitore c’è già.');return;}
    save('fornitori',{id:uid(),name:n}).then(function(){renderTab();toast('Fornitore aggiunto.');});
  }
  iName.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();add();}});
  v.append(h('div',{class:'head'},h('h2',null,'Fornitori',rows.length?h('small',{text:String(rows.length)}):null)),
    err,h('div',{class:'tempwrap',style:'margin-bottom:14px'},iName,h('button',{type:'button',class:'btn primary',text:'Aggiungi',onclick:add})));
  if(!rows.length){v.append(h('div',{class:'empty'},h('b',{text:'Nessun fornitore.'}),'I fornitori si aggiungono anche da soli quando registri una ricezione.'));return;}
  var list=h('div',{class:'list'});
  rows.forEach(function(f){
    var n=S.bolle.filter(function(b){return norm(b.supplier)===norm(f.name);}).length;
    list.append(h('div',{class:'item'},h('span',{class:'cbody'},h('span',{class:'ctitle',text:f.name}),h('span',{class:'cmeta',text:n+(n===1?' ricezione':' ricezioni')})),
      h('button',{type:'button',class:'btn small danger',text:'Elimina',onclick:function(){
        confirmSheet('Togliere «'+f.name+'» dall’elenco? Le ricezioni già registrate restano.','Elimina',function(){remove('fornitori',f.id).then(function(){renderTab();toast('Fornitore eliminato.');});});
      }})));
  });
  v.append(list);
}

/* ---------- dati: copia, trasferimento, esportazioni ---------- */
async function encode(v){
  if(v instanceof Blob)return {$blob:await blobToDataURL(v)};
  if(Array.isArray(v)){var a=[];for(var i=0;i<v.length;i++)a.push(await encode(v[i]));return a;}
  if(v&&typeof v==='object'){var o={};for(var k in v)o[k]=await encode(v[k]);return o;}
  return v;
}
function dataURLToBlob(u){
  var i=u.indexOf(','),meta=u.slice(5,i).split(';')[0],bin=atob(u.slice(i+1)),a=new Uint8Array(bin.length);
  for(var k=0;k<bin.length;k++)a[k]=bin.charCodeAt(k);
  return new Blob([a],{type:meta||'image/jpeg'});
}
function decode(v){
  if(Array.isArray(v))return v.map(decode);
  if(v&&typeof v==='object'){
    if(typeof v.$blob==='string')return dataURLToBlob(v.$blob);
    var o={};for(var k in v)o[k]=decode(v[k]);return o;
  }
  return v;
}
async function exportAll(setMsg){
  var parts=['{"app":"haccp-cucina","version":2,"exportedAt":'+Date.now()+',"stores":{'],n=0,tot=0;
  STORES.forEach(function(s){tot+=S[s].length;});
  for(var si=0;si<STORES.length;si++){
    var s=STORES[si];parts.push((si?',':'')+JSON.stringify(s)+':[');
    for(var i=0;i<S[s].length;i++){
      parts.push((i?',':'')+JSON.stringify(await encode(S[s][i])));n++;
      if(n%5===0){setMsg('Preparo il file… '+n+' di '+tot);await tick();}
    }
    parts.push(']');
  }
  parts.push('}}');
  return new Blob(parts,{type:'application/json'});
}
async function mergeImport(st){
  var n={bolle:0,ing:0,lotti:0,ric:0,prod:0,forn:0},imap={},rmap={},i,x;
  var list=function(k){return st[k]||[];};
  for(i=0;i<list('fornitori').length;i++){x=list('fornitori')[i];if(!S.fornitori.some(function(f){return norm(f.name)===norm(x.name);})){await save('fornitori',x);n.forn++;}}
  for(i=0;i<list('ingredienti').length;i++){
    x=list('ingredienti')[i];
    var ex=S.ingredienti.find(function(y){return y.id===x.id||(x.barcode&&y.barcode===x.barcode)||norm(y.name)===norm(x.name);});
    if(ex)imap[x.id]=ex.id;else{await save('ingredienti',x);n.ing++;}
  }
  var newR=[];
  list('ricette').forEach(function(r){var e=S.ricette.find(function(y){return y.id===r.id||norm(y.name)===norm(r.name);});if(e)rmap[r.id]=e.id;else newR.push(r);});
  for(i=0;i<newR.length;i++){
    x=newR[i];x.components=(x.components||[]).map(function(c){return {kind:c.kind,refId:c.kind==='ing'?(imap[c.refId]||c.refId):(rmap[c.refId]||c.refId)};});
    await save('ricette',x);n.ric++;
  }
  for(i=0;i<list('lotti').length;i++){x=list('lotti')[i];if(S.m.lot[x.id])continue;x=decode(x);x.ingId=imap[x.ingId]||x.ingId;await save('lotti',x);n.lotti++;}
  for(i=0;i<list('produzioni').length;i++){
    x=list('produzioni')[i];if(S.m.prod[x.id])continue;
    x.ricettaId=rmap[x.ricettaId]||x.ricettaId;
    x.items=(x.items||[]).map(function(it){return it.type==='ing'?Object.assign({},it,{ingId:imap[it.ingId]||it.ingId}):Object.assign({},it,{ricettaId:rmap[it.ricettaId]||it.ricettaId});});
    await save('produzioni',x);n.prod++;
  }
  for(i=0;i<list('bolle').length;i++){x=list('bolle')[i];if(S.m.bolla[x.id])continue;await save('bolle',decode(x));n.bolle++;}
  var amap={};
  for(i=0;i<list('apparecchi').length;i++){x=list('apparecchi')[i];var ea=S.apparecchi.find(function(y){return y.id===x.id||norm(y.name)===norm(x.name);});if(ea)amap[x.id]=ea.id;else await save('apparecchi',x);}
  for(i=0;i<list('temperature').length;i++){x=list('temperature')[i];if(S.temperature.some(function(y){return y.id===x.id;}))continue;x.apparatoId=amap[x.apparatoId]||x.apparatoId;await save('temperature',x);}
  return n;
}
async function replaceImport(st){
  for(var s=0;s<STORES.length;s++){
    await clearStore(STORES[s]);
    var rows=st[STORES[s]]||[];
    for(var i=0;i<rows.length;i++)await save(STORES[s],decode(rows[i]));
  }
}
function openImport(){
  var sh=sheet('Carica un file di dati'),err=h('p',{class:'err',hidden:true}),status=h('p',{class:'status'});
  var file=h('input',{type:'file',accept:'.json,application/json',id:'f'+(++fid)});
  var info=h('div'),data=null;
  sh.body.append(h('p',{class:'hint',text:'Scegli un file creato con «Salva tutti i dati in un file» su un altro dispositivo.'}),err,
    h('div',{class:'field'},h('label',{class:'lbl','for':file.id,text:'File'}),file),status,info);
  var mergeBtn=h('button',{type:'button',class:'btn primary',text:'Unisci ai dati presenti',disabled:true}),repBtn=h('button',{type:'button',class:'btn danger',text:'Sostituisci tutto',disabled:true});
  sh.foot.append(repBtn,mergeBtn);
  file.addEventListener('change',function(){
    err.hidden=true;data=null;mergeBtn.disabled=repBtn.disabled=true;info.textContent='';status.textContent='Leggo il file…';
    var f=file.files&&file.files[0];if(!f){status.textContent='';return;}
    var fr=new FileReader();
    fr.onload=function(){
      try{
        var d=JSON.parse(fr.result);
        if(!d||d.app!=='haccp-cucina'||!d.stores)throw new Error('formato');
        data=d.stores;status.textContent='';
        var kv=h('dl',{class:'kv'});
        [['bolle','Ricezioni'],['ingredienti','Ingredienti'],['lotti','Lotti'],['ricette','Ricette'],['produzioni','Lavorazioni'],['fornitori','Fornitori'],['apparecchi','Apparecchi'],['temperature','Controlli temperatura']].forEach(function(p){kv.append(h('dt',{text:p[1]}),h('dd',{text:String((data[p[0]]||[]).length)}));});
        info.append(h('p',{class:'hint',text:'Il file contiene:'}),kv,h('p',{class:'hint',text:'«Unisci» aggiunge solo quello che manca e non tocca i dati già presenti. «Sostituisci» cancella tutto e carica il file.'}));
        mergeBtn.disabled=repBtn.disabled=false;
      }catch(e){status.textContent='';showErr(err,'Questo file non è un salvataggio dell’app.');}
    };
    fr.onerror=function(){status.textContent='';showErr(err,'Non riesco a leggere il file.');};
    fr.readAsText(f);
  });
  mergeBtn.addEventListener('click',async function(){
    mergeBtn.disabled=repBtn.disabled=true;status.textContent='Unisco i dati…';
    try{
      var n=await mergeImport(data);sh.close();renderTab();
      toast('Importato: '+n.bolle+' ricezioni, '+n.prod+' lavorazioni, '+n.lotti+' lotti, '+n.ric+' ricette.');
    }catch(e){status.textContent='';showErr(err,'Importazione non riuscita. Controlla lo spazio libero e riprova.');mergeBtn.disabled=repBtn.disabled=false;}
  });
  repBtn.addEventListener('click',function(){
    confirmSheet('Tutti i dati di questo dispositivo verranno cancellati e sostituiti da quelli del file. Non si può annullare.','Sostituisci tutto',async function(){
      var w=sheet('Sostituzione in corso');w.body.append(h('p',{text:'Attendi…'}));
      try{await replaceImport(data);w.close();sh.close();renderTab();toast('Dati sostituiti.');}
      catch(e){w.close();showErr(err,'Sostituzione non riuscita. Riprova.');}
    });
  });
}
function prodCsv(){
  var out=[['Data','Ora','Ricetta','Lotto interno','Scadenza','Componente','Tipo','Lotto componente','Scadenza componente','Fornitore','Bolle','Note']];
  S.produzioni.slice().sort(function(a,b){return a.ts-b.ts;}).forEach(function(p){
    (p.items||[]).forEach(function(it){
      var l=it.type==='ing'?S.m.lot[it.lottoId]:null,pp=it.type==='prep'?S.m.prod[it.produzioneId]:null;
      out.push([fmtDate(p.ts),fmtTime(p.ts),p.ricettaName,p.lotInterno,p.expiry?fmtISO(p.expiry):'',it.name,it.type==='ing'?'Ingrediente':'Preparazione',
        l?l.lot:(pp?pp.lotInterno:''),l&&l.expiry?fmtISO(l.expiry):(pp&&pp.expiry?fmtISO(pp.expiry):''),l?l.supplier:'',
        (it.bollaIds||[]).map(function(b){return S.m.bolla[b]?bollaLabel(S.m.bolla[b]):'';}).join(' | '),p.note||'']);
    });
  });
  return toCsv(out);
}
function renderDati(v){
  v.append(h('div',{class:'head'},h('h2',{text:'Dati'})));
  var st=h('p',{class:'status'}),btnAll=h('button',{type:'button',class:'btn primary',text:'Salva tutti i dati in un file'});
  btnAll.addEventListener('click',async function(){
    btnAll.disabled=true;
    try{
      var b=await exportAll(function(m){st.textContent=m;});st.textContent='';
      var ok=await sendFile('haccp-dati-'+todayISO()+'.json',b,'application/json','File pronto. Invialo a te stesso o salvalo.');
      if(ok){S.lastExport=Date.now();lsSet('haccp.lastExport',S.lastExport);renderNotices();}
    }catch(e){st.textContent='';toast('Non sono riuscito a preparare il file.');}
    btnAll.disabled=false;
  });
  v.append(h('div',{class:'section'},h('h3',{text:'Copia e trasferimento'}),
    h('p',{text:'Un solo file contiene tutto, foto comprese. Serve come copia di sicurezza e per spostare i dati da un dispositivo all’altro, senza database online.'}),
    st,h('div',{class:'btns'},btnAll,h('button',{type:'button',class:'btn',text:'Carica un file di dati',onclick:openImport}))));
  v.append(h('div',{class:'section'},h('h3',{text:'Esportazioni da allegare a una mail'}),
    h('p',{text:'PDF con le foto o tabelle CSV, per i controlli e per il commercialista.'}),
    h('div',{class:'btns'},h('button',{type:'button',class:'btn',text:'Registro ricezioni',onclick:openExport}),
      h('button',{type:'button',class:'btn',text:'Temperature',onclick:openTempExport}),
      h('button',{type:'button',class:'btn',text:'Lavorazioni (CSV)',onclick:function(){
        if(!S.produzioni.length){toast('Non ci sono ancora lavorazioni.');return;}
        sendFile('lavorazioni-'+todayISO()+'.csv',prodCsv(),'text/csv');
      }}))));
  var sp=h('p',{text:''});
  v.append(h('div',{class:'section'},h('h3',{text:'Spazio sul dispositivo'}),sp));
  try{
    if(navigator.storage&&navigator.storage.estimate)navigator.storage.estimate().then(function(e){
      sp.textContent='Usato circa '+Math.round((e.usage||0)/1048576)+' MB.'+(S.db?'':' Il salvataggio su questo dispositivo non è disponibile: i dati si perdono alla chiusura.');
    });
  }catch(e){}
}

/* ---------- schede e avvio ---------- */
var TABS=[['ric','Ricezione',renderRic],['lav','Lavorazioni',renderLav],['rec','Ricette',renderRec],['ing','Ingredienti',renderIng],['temp','Temperature',renderTemp],['eti','Etichette',renderEti],['trac','Tracciabilità',renderTrac],['forn','Fornitori',renderForn],['dati','Dati',renderDati]];
function drawTabs(){
  var nav=$('#tabs');nav.textContent='';
  TABS.forEach(function(t){
    nav.append(h('button',{type:'button',class:'tab','aria-current':S.tab===t[0]?'page':null,text:t[1],onclick:function(){S.tab=t[0];lsSet('haccp.tab',t[0]);renderTab();window.scrollTo(0,0);}}));
  });
  var cur=$('[aria-current=page]',nav);if(cur&&cur.scrollIntoView)try{cur.scrollIntoView({inline:'center',block:'nearest'});}catch(e){}
}
function renderNotices(){
  var box=$('#notices');box.textContent='';
  if(!S.db)box.append(h('div',{class:'notice warn'},h('span',{text:'Il salvataggio sul dispositivo non è disponibile in questa vista. I dati restano solo finché la pagina è aperta.'})));
  if(tempDue())box.append(h('div',{class:'notice warn'},h('span',{text:'È ora del controllo settimanale delle temperature dei frigoriferi.'}),h('button',{type:'button',class:'btn small',text:'Fai il controllo',onclick:openTempCheck})));
  if(S.bolle.length||S.produzioni.length){
    var oldest=Math.min.apply(null,S.bolle.map(function(r){return r.ts;}).concat(S.produzioni.map(function(r){return r.ts;})));
    var ref=S.lastExport||oldest,days=Math.floor((Date.now()-ref)/864e5);
    if(days>=7)box.append(h('div',{class:'notice'},h('span',{text:S.lastExport?'L’ultimo salvataggio dei dati è di '+days+' giorni fa.':'I dati non sono mai stati salvati in un file. Una copia ti protegge se il dispositivo si rompe.'}),
      h('button',{type:'button',class:'btn small',text:'Vai a Dati',onclick:function(){S.tab='dati';renderTab();}})));
  }
}
function renderTab(){
  revokeList();drawTabs();
  var v=$('#view');v.textContent='';
  var t=TABS.find(function(x){return x[0]===S.tab;})||TABS[0];
  t[2](v);renderNotices();
}
async function boot(){
  var saved=lsGet('haccp.tab');if(saved&&TABS.some(function(t){return t[0]===saved;}))S.tab=saved;
  try{S.db=await idbOpen();}catch(e){S.db=null;}
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  if(S.db){
    for(var i=0;i<STORES.length;i++){
      try{S[STORES[i]]=(await tx(STORES[i],'readonly',function(s){return s.getAll();}))||[];}catch(e){S[STORES[i]]=[];}
    }
  }
  reindex();
  if(!S.fornitori.length&&S.bolle.length){
    var seen={};
    for(var j=0;j<S.bolle.length;j++){var n=S.bolle[j].supplier;if(n&&!seen[norm(n)]){seen[norm(n)]=1;await save('fornitori',{id:uid(),name:n});}}
  }
  renderTab();
}
boot();
})();
